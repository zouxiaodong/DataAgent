<h2>配色方案</h2>
<p class="subtitle">玻璃拟态风格需要搭配合适的配色 — 你希望整体色调偏向哪种感觉？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>冷色调 — 蓝紫渐变</h3>
      <p>深蓝/紫色渐变背景 + 半透明白色玻璃卡片 + 蓝色强调色。科技感强，类似 macOS Big Sur</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>暖色调 — 橙金渐变</h3>
      <p>暖橙/金色渐变背景 + 半透明白色玻璃卡片 + 琥珀色强调色。温暖亲和，体现"高速"活力</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>中性色调 — 青绿渐变</h3>
      <p>青绿/翡翠色渐变背景 + 半透明磨砂玻璃 + 翠绿色强调色。清新自然，专业稳重</p>
    </div>
  </div>
  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>深色模式 — 暗色玻璃</h3>
      <p>深色背景 + 半透明深色玻璃卡片 + 发光强调色。高端科技感，适合数据密集型应用</p>
    </div>
  </div>
</div>
