<h2>首页设计</h2>
<p class="subtitle">沉浸式布局的核心是首页 — 你希望首页呈现什么内容？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>仪表盘式首页</h3>
      <p>顶部统计卡片（智能体数量、运行次数等）+ 常用智能体快捷入口 + 最近运行记录</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>智能体展示首页</h3>
      <p>大尺寸智能体卡片网格，每个卡片展示图标、名称、描述、状态。类似应用商店的布局</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>对话式首页</h3>
      <p>页面中央大输入框，直接输入问题开始分析，下方显示推荐智能体。类似搜索引擎</p>
    </div>
  </div>
</div>
