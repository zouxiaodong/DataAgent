<h2>运行界面设计</h2>
<p class="subtitle">运行界面是最核心的交互页面 — 你希望聊天对话区域如何布局？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>全屏聊天</h3>
      <p>整个页面就是聊天窗口，顶部标题栏，中间对话区，底部输入框。类似 ChatGPT 的沉浸式体验</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>左侧历史 + 右侧对话</h3>
      <p>左侧显示会话历史列表，右侧是当前对话区。方便在多个会话间切换</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>三栏布局</h3>
      <p>左侧智能体信息 + 中间对话区 + 右侧结果面板（图表/报告/数据）。信息密度最高</p>
    </div>
  </div>
</div>
